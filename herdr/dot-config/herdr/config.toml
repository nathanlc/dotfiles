onboarding = false
[keys]
prefix = "ctrl+space"
last_pane = "ctrl+tab"
switch_tab = "prefix+1..9"
# switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"
previous_agent = "prefix+ctrl+k"
next_agent = "prefix+ctrl+j"
previous_workspace = "prefix+shift+k"
next_workspace = "prefix+shift+j"
copy_mode = "prefix+v"
split_vertical = "prefix+percent"
split_horizontal = "prefix+quote"

[[keys.command]]
key = "prefix+l"
type = "popup"
command = "herdr_workspace_switch.sh"
description = "switch workspace"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+shift+l"
type = "popup"
command = "herdr_project.sh"
description = "find project or create"
width = "80%"
height = "80%"

[[keys.command]]
key = "ctrl+alt+k"
type = "shell"
command = "herdr_kings_landing.sh"
description = "kings-landing workspace"

[[keys.command]]
key = "ctrl+alt+a"
type = "shell"
command = "herdr_analyzer.sh"
description = "analyzer workspace"

[[keys.command]]
key = "ctrl+alt+s"
type = "shell"
command = "herdr_mds.sh"
description = "medical data service workspace"

[[keys.command]]
key = "ctrl+alt+c"
type = "shell"
command = "herdr_dotfiles.sh"
description = "dotfiles workspace"

[ui]
tab_bar_position = "bottom"
sidebar_collapsed_mode = "hidden"
prompt_new_tab_name = false

tab_bar_right = [
	{ type = "command", command = "herdr_workspace.sh", interval_seconds = 2 },
	{ type = "command", command = "herdr_git.sh", interval_seconds = 2 },
]
tab_bar_right_separator = "  "

show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"
[ui.sidebar.spaces]
rows = [["workspace"], ["branch"]]

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["tab"],
]

# overlay1 drives both the active tab highlight and the tab bar right status
# text (workspace/branch) - no separate token exists for just one of them.
[theme.custom]
overlay1 = "#ffffff"

[ui.toast]
delivery = "system"

[theme]
name = "catppuccin"
auto_switch = false
